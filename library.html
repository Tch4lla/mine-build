<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sōzō Sprite Library</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <style>
      /* Layout: a full-width 3D field between a short header and icon grids. */
      :root {
        --paper: #f3ead8;
        --ink: #2a221d;
        --muted: #6e6258;
        --accent: #b8452c;
        --rule: #2a221d;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --paper: #1f1b18;
          --ink: #efe6d6;
          --muted: #b3a797;
          --accent: #e98a6c;
          --rule: #4a4038;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --paper: #1f1b18;
        --ink: #efe6d6;
        --muted: #b3a797;
        --accent: #e98a6c;
        --rule: #4a4038;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, sans-serif;
      }
      header,
      section {
        padding-block: 16px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        text-wrap: balance;
      }
      h2 {
        margin: 18px 0 8px;
        font-size: 17px;
        color: var(--accent);
      }
      p {
        margin: 0;
        max-width: 70ch;
        color: var(--muted);
        font-size: 14px;
      }
      #world {
        position: relative;
      }
      #world canvas {
        display: block;
        width: 100%;
        height: 70vh;
        border-top: 2px solid var(--rule);
        border-bottom: 2px solid var(--rule);
        cursor: grab;
        touch-action: none;
      }
      #tip {
        position: absolute;
        pointer-events: none;
        background: var(--ink);
        color: var(--paper);
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 13px;
        white-space: nowrap;
      }
      .icons {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 4px;
      }
      .icons img {
        width: 64px;
        height: 64px;
        max-width: 100%;
      }
      .icons figure {
        margin: 0;
        min-width: 0;
        text-align: center;
        font-size: 10px;
        color: var(--muted);
      }
      .icons figcaption {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Sōzō sprite library: export check</h1>
      <p>
        Drag to orbit, scroll to zoom, hover a block for its name. The front row pairs each existing world
        block (left) with its library look (right); behind it are all library blocks by category, drawn with
        the game's toon shading and ink outline.
      </p>
    </header>
    <div id="world"><div id="tip" hidden></div></div>
    <section id="icons"></section>
    <script type="module" src="/src/libraryView/main.ts"></script>
  </body>
</html>
